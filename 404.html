<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka nenalezena | Top výšivka</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F8D547">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/img/favicon-96.png" type="image/png" sizes="96x96">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  body{margin:0;background:#F8D547}
  .tv-404{min-height:100vh;display:flex;flex-direction:column;background:var(--yellow)}
  .tv-404__in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:56px 16px 80px;text-align:center}
  .tv-404__num{font-size:clamp(130px,30vw,300px);line-height:.86}
  .tv-404__title{font:700 clamp(28px,4.6vw,44px)/1.1 'Baloo 2',ui-rounded,sans-serif;letter-spacing:-.02em}
  .tv-404__text{max-width:460px;font-size:18px;color:var(--ink2)}
  .tv-404__btns{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-top:10px}
</style>
</head>
<body>
<div class="tv tv-404">
  <header class="tv-header">
    <div class="tv-wrap tv-header__in">
      <a class="tv-logo" href="/" aria-label="Top výšivka – hlavní stránka">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21.5" fill="#F5A8D3" stroke="#3B2418" stroke-width="3"></circle><circle cx="24" cy="24" r="15.5" fill="none" stroke="#3B2418" stroke-width="2" stroke-dasharray="3.2 2.8" stroke-linecap="round"></circle><path d="M16.5 18.5h15M24 18.5v13" fill="none" stroke="#3B2418" stroke-width="4.2" stroke-linecap="round"></path></svg>
        <span>Top výšivka</span>
      </a>
    </div>
  </header>
  <main class="tv-404__in">
    <p class="tv-d tv-404__num" aria-hidden="true">404</p>
    <h1 class="tv-404__title">Tahle stránka se nám nevyšila</h1>
    <p class="tv-404__text">Odkaz je asi starý nebo se v něm někde zamotala nit. Zkuste to z hlavní stránky – tam je všechno pěkně prošité.</p>
    <div class="tv-404__btns">
      <a class="tv-btn tv-btn--ink" href="/">Na hlavní stránku<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
      <a class="tv-btn tv-btn--cream" href="/#poptavka">Poslat poptávku</a>
    </div>
  </main>
</div>
</body>
</html>
