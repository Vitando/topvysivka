# Administrace textů – Pages CMS (https://pagescms.org)
# Upravuje jen content/texty.json; do index.html je promítne GitHub Action .github/workflows/texts.yml.
# Pořadí a názvy polí musí odpovídat content/texty.json a značkám <!--t:…--> / data-t v index.html.

content:
  - name: texty
    label: Texty webu
    type: file
    path: content/texty.json
    format: json
    fields:
      - name: seo
        label: "Google a sdílení odkazu"
        description: "Tyto texty nejsou vidět přímo na stránce."
        type: object
        fields:
          - name: titulek
            label: "Titulek stránky"
            description: "Zobrazí se v záložce prohlížeče a jako nadpis ve výsledcích Googlu."
            type: string
            required: true
          - name: popis
            label: "Popis pro Google"
            description: "Text pod nadpisem ve výsledcích vyhledávání. Ideálně do 160 znaků."
            type: text
            required: true
          - name: sdileni_nadpis
            label: "Nadpis při sdílení odkazu"
            description: "Např. na Facebooku nebo ve WhatsAppu."
            type: string
            required: true
          - name: sdileni_popis
            label: "Popis při sdílení odkazu"
            type: text
            required: true

      - name: menu
        label: "Menu a logo"
        description: "Platí pro horní menu, mobilní menu i menu v patičce."
        type: object
        fields:
          - name: logo
            label: "Název vedle loga"
            type: string
            required: true
          - name: sluzby
            label: "Položka „Služby“"
            type: string
            required: true
          - name: jak
            label: "Položka „Jak to funguje“"
            type: string
            required: true
          - name: reference
            label: "Položka „Reference“"
            type: string
            required: true
          - name: faq
            label: "Položka „FAQ“"
            type: string
            required: true
          - name: kontakt
            label: "Položka „Kontakt“"
            type: string
            required: true
          - name: tlacitko
            label: "Tlačítko v hlavičce"
            type: string
            required: true

      - name: uvod
        label: "Úvod (horní část stránky)"
        type: object
        fields:
          - name: stitek
            label: "Štítek nad nadpisem"
            type: string
            required: true
          - name: podtitul
            label: "Podtitul pod štítkem"
            type: text
            required: true
          - name: nadpis1
