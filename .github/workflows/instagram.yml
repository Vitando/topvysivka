name: Instagram galerie

on:
  schedule:
    - cron: '17 4 * * *'   # každý den kolem 6:17 českého času
  workflow_dispatch:        # ruční spuštění v záložce Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stáhnout příspěvky z Instagramu
        run: node scripts/sync-instagram.mjs
        env:
          BEHOLD_FEED_URL: ${{ vars.BEHOLD_FEED_URL }}

      - name: Uložit změny
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add -A index.html assets/img/instagram
            git commit -m "Instagram: aktualizace galerie"
            git push
          else
            echo "Žádné nové příspěvky."
          fi
