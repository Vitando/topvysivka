name: Texty webu

on:
  push:
    branches: [main]
    paths:
      - content/texty.json   # uložení v administraci (Pages CMS)
  workflow_dispatch:          # ruční spuštění v záložce Actions

permissions:
  contents: write

# Stejná skupina jako instagram.yml – oba workflowy zapisují do index.html, běží po jednom
concurrency:
  group: site-content
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Promítnout texty do index.html
        run: node scripts/apply-texts.mjs

      - name: Uložit změny
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Texty: aktualizace z administrace"
            git pull --rebase
            git push
          else
            echo "Texty beze změny."
          fi
